<div
  class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in"
>
  <input
    type="checkbox"
    name="toggle"
    id="toggle"
    class="peer absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer checked:bg-green-500 checked:right-0"
    [(ngModel)]="checked"
  />
  <label
    for="toggle"
    class="peer-checked:bg-green-500 block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"
  ></label>
</div>
